---
controller_credentials:
  - name: Git Credentials
    organization: "{{ aap_organizations[0].name }}"
    state: present
    credential_type: Source Control
    inputs:
      ssh_key_data: "{{ v_git_private_key }}"

  - name: Automation Hub Credentials
    organization: "{{ aap_organizations[0].name }}"
    state: present
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: "{{ v_automationhub_url }}"
      auth_url: "{{ v_automationhub_auth_url }}"
      token: "{{ v_automationhub_token }}"

  - name: Galaxy Credentials
    organization: "{{ aap_organizations[0].name }}"
    state: present
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: https://galaxy.ansible.com/

  - name: RHEL Credential
    organization: "{{ aap_organizations[0].name }}"
    state: present
    credential_type: Machine
    inputs:
      username: "{{ v_rhel_username | default('ec2-user') }}"
      ssh_key_data: "{{ v_rhel_ssh_private_key }}"
      become_method: sudo
      become_username: root

  - name: Windows Credential
    organization: "{{ aap_organizations[0].name }}"
    state: present
    credential_type: Machine
    inputs:
      username: "{{ v_windows_username }}"
      password: "{{ v_windows_password }}"

  - name: Vault Credentials
    organization: "{{ aap_organizations[0].name }}"
    state: present
    credential_type: Vault
    inputs:
      vault_password: "{{ v_vault_password }}"
