---
# Shared RHEL scan templates (deployed when any RHEL profile is selected)
rhel_scan_templates:

  - name: JT - RHEL Scan Pre
    job_type: run
    inventory: Workshop RHEL
    project: Git Compliance
    playbook: soe-rhel-run-scan.yml
    labels: [compliance, rhel]
    credentials:
      - RHEL Credential
      - Vault Credentials
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: Compliance Profile
      description: Select the compliance profile to scan against
      spec:
        - question_name: Compliance Profile
          question_description: Select the compliance profile
          variable: compliance_profile_id
          type: multiplechoice
          required: true
          default: CIS
          choices: "CIS\nE8"
    extra_vars:
      v_stage: preharden

  - name: JT - RHEL Scan Post
    job_type: run
    inventory: Workshop RHEL
    project: Git Compliance
    playbook: soe-rhel-run-scan.yml
    labels: [compliance, rhel]
    credentials:
      - RHEL Credential
      - Vault Credentials
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: Compliance Profile
      description: Select the compliance profile to scan against
      spec:
        - question_name: Compliance Profile
          question_description: Select the compliance profile
          variable: compliance_profile_id
          type: multiplechoice
          required: true
          default: CIS
          choices: "CIS\nE8"
    extra_vars:
      v_stage: postharden

# RHEL 8 -- CIS only
