---
- name: Apply {{ compliance_profile_id | default('CIS') }} Benchmark compliance hardening - RHEL 10
  hosts: all
  become: true
  become_method: sudo
  vars:
    rhel_version: "10"

  tasks:
    - name: Apply RHEL {{ rhel_version }} {{ compliance_profile_id | default('CIS') }} Compliance Hardening
      ansible.builtin.include_role:
        name: "rhel{{ rhel_version }}-{{ compliance_profile_id | default('cis') | lower }}"
        tasks_from: "rhel{{ rhel_version }}-playbook-{{ compliance_profile_id | default('cis') | lower }}.yml"
